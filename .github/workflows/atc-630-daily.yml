name: ATC 630 daily confirmed scan

on:
  workflow_dispatch:
  # One-time live-data pilot when the workflow definition is installed/updated.
  # Other main-branch commits do not trigger expensive market-wide scans.
  push:
    branches: [main]
    paths: [.github/workflows/atc-630-daily.yml]
  schedule:
    # 18:45 Türkiye saati, BIST 18:10 kapanış müzayedesinden sonra.
    - cron: "45 15 * * 1-5"

permissions:
  contents: read

concurrency:
  group: atc-630-daily-v2
  cancel-in-progress: false

jobs:
  recover-legacy:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel pre-upgrade blocked ATC MA workflow runs
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            for (const run_id of [38641050430, 38649036105]) {
              try {
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner, repo: context.repo.repo, run_id
                });
                if (["queued", "in_progress", "pending", "waiting"].includes(run.status)) {
                  await github.rest.actions.cancelWorkflowRun({
                    owner: context.repo.owner, repo: context.repo.repo, run_id
                  });
                  core.info("Cancelled obsolete ATC workflow run " + run_id);
                } else {
                  core.info("Old run already " + run.status + ": " + run_id);
                }
              } catch (e) {
                core.warning("Old run " + run_id + " could not be cancelled: " + e.message);
              }
            }
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      APP_ENV: production
      APP_TIMEZONE: Europe/Istanbul
      TZ: UTC
      DELIVERY_MODE: disabled
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BORSAPP_REPOSITORY_ROOT: ${{ github.workspace }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ALLOWED_USERS: ${{ vars.TELEGRAM_ALLOWED_USERS }}
      TELEGRAM_TOPIC_COMMAND: ${{ vars.TELEGRAM_TOPIC_COMMAND }}
      TELEGRAM_TOPIC_SCANS: ${{ vars.TELEGRAM_TOPIC_SCANS }}
      TELEGRAM_TOPIC_ANALYSIS: ${{ vars.TELEGRAM_TOPIC_ANALYSIS }}
      TELEGRAM_TOPIC_CHARTS: ${{ vars.TELEGRAM_TOPIC_CHARTS }}
      TELEGRAM_TOPIC_NEWS: ${{ vars.TELEGRAM_TOPIC_NEWS }}
      TELEGRAM_TOPIC_CALENDAR: ${{ vars.TELEGRAM_TOPIC_CALENDAR }}
      TELEGRAM_TOPIC_REPORTS: ${{ vars.TELEGRAM_TOPIC_REPORTS }}
      TELEGRAM_TOPIC_SYSTEM: ${{ vars.TELEGRAM_TOPIC_SYSTEM }}
      TELEGRAM_TIMEFRAME_TOPICS: ${{ vars.TELEGRAM_TIMEFRAME_TOPICS || secrets.TELEGRAM_TIMEFRAME_TOPICS }}
      TELEGRAM_TOPIC_1D: ${{ vars.TELEGRAM_TOPIC_1D || secrets.TELEGRAM_TOPIC_1D }}
      TELEGRAM_TOPIC_DAILY: ${{ vars.TELEGRAM_TOPIC_DAILY || secrets.TELEGRAM_TOPIC_DAILY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify persistent database
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL missing. Configure an external persistent PostgreSQL secret."
            exit 1
          fi
      - name: Install ONLY database client for capacity preflight
        run: python -m pip install 'psycopg[binary]>=3,<4'
      - name: Reject unsafe snapshot writes before downloading scanner dependencies
        run: python -m scripts.atc_database_capacity
      - name: Install existing Python scanner runtime
        run: python -m pip install --editable ".[runtime,atcdata]"
      - name: Migrate existing database
        run: borsapp db-migrate
      - name: Seed all 630 watched symbols and report provider gaps
        run: python scripts/atc_universe_seed.py --apply
      # MA rule 18 is refreshed by the independent ma-research.yml workflow.
      # Its long 630 x 112 MA quality pass MUST NOT block daily rules 1-17.
      - name: Verify ATC_630 membership for Istanbul run date
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import psycopg
          from market_intelligence.persistence.postgres.runtime import PostgresRuntimeRepository
          as_of = datetime.now(ZoneInfo("Europe/Istanbul")).date()
          with psycopg.connect(os.environ["DATABASE_URL"]) as db:
              members = PostgresRuntimeRepository(db).list_universe("ATC_630", as_of=as_of)
          print(f"ATC_630 active members on {as_of}: {len(members)}", flush=True)
          if len(members) != 630:
              raise SystemExit("ATC_630 watchlist not visible at scan evaluation date")
          PY
      - name: Run 630-symbol daily scan with native Pine rules
        id: daily
        continue-on-error: true
        run: borsapp scan-due --universe ATC_630 --timeframe 1d --bars 600 --workers 8
      - name: Export real outcomes, no synthetic signals
        if: always() && steps.daily.outcome != 'skipped'
        run: |
          python scripts/atc_export_dashboard.py \
            --universe ATC_630 \
            --require-members 630 \
            --output runtime_artifacts/ATC_Tarama_Matris.csv
      - name: Validate 18 scanner bindings before live visual delivery
        if: ${{ steps.daily.outcome == 'success' && vars.ENABLE_TIMEFRAME_IMAGE_REPORTS != 'false' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from market_intelligence.scanning.catalog import load_scanner_catalog
          from market_intelligence.scheduling.xist import ExchangeCalendarsXist
          bindings = load_scanner_catalog(
              Path("config/scanners.toml"),
              calendar_version=ExchangeCalendarsXist().version,
          )
          print("Live visual scanner catalog:", len(bindings), "bindings")
          if len(bindings) != 18:
              raise SystemExit("Expected exactly 18 ATC scanner bindings")
          PY
      - name: Deliver confirmed PNG/CSV with persistent Telegram delivery diagnostics
        if: ${{ steps.daily.outcome == 'success' && vars.ENABLE_TIMEFRAME_IMAGE_REPORTS != 'false' }}
        run: python -m scripts.atc_timeframe_visuals --timeframe 1d --skip-if-unmapped
      - name: Report scan engine failure to Actions checks
        if: steps.daily.outcome == 'failure'
        run: |
          echo "::error::One or more ATC scan steps failed. Check market provider and data quality."
          exit 1
