name: ATC cloud dashboard and Telegram report

on:
  workflow_dispatch:
    inputs:
      notify:
        description: Queue Telegram report only when explicitly enabled in repository variables
        required: true
        default: false
        type: boolean
  schedule:
    # 19:45 Türkiye saati, iş günleri. GitHub schedule best-effort, not exact.
    - cron: "45 16 * * 1-5"

permissions:
  contents: read

concurrency:
  group: borsapp-atc-cloud-eod
  cancel-in-progress: false

jobs:
  export-and-report:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_ATC_CLOUD_REPORT == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: production
      APP_TIMEZONE: Europe/Istanbul
      BORSAPP_REPOSITORY_ROOT: ${{ github.workspace }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DELIVERY_MODE: ${{ vars.ATC_REPORT_DELIVERY_MODE || 'shadow' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ALLOWED_USERS: ${{ vars.TELEGRAM_ALLOWED_USERS }}
      TELEGRAM_TOPIC_COMMAND: ${{ vars.TELEGRAM_TOPIC_COMMAND }}
      TELEGRAM_TOPIC_SCANS: ${{ vars.TELEGRAM_TOPIC_SCANS }}
      TELEGRAM_TOPIC_ANALYSIS: ${{ vars.TELEGRAM_TOPIC_ANALYSIS }}
      TELEGRAM_TOPIC_CHARTS: ${{ vars.TELEGRAM_TOPIC_CHARTS }}
      TELEGRAM_TOPIC_NEWS: ${{ vars.TELEGRAM_TOPIC_NEWS }}
      TELEGRAM_TOPIC_CALENDAR: ${{ vars.TELEGRAM_TOPIC_CALENDAR }}
      TELEGRAM_TOPIC_REPORTS: ${{ vars.TELEGRAM_TOPIC_REPORTS }}
      TELEGRAM_TOPIC_SYSTEM: ${{ vars.TELEGRAM_TOPIC_SYSTEM }}
      ATC_REQUIRED_MEMBERS: ${{ vars.ATC_REQUIRED_MEMBERS || '630' }}
      ATC_SCHEDULED_NOTIFY: ${{ vars.ENABLE_ATC_REPORT_NOTIFICATIONS || 'false' }}
      ATC_MANUAL_NOTIFY: ${{ inputs.notify || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check durable database connection
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret yok. GitHub Actions koşucuları kalıcı veritabanı değildir."
            exit 1
          fi
      - name: Install existing scanner runtime
        run: python -m pip install --editable ".[runtime]"
      - name: Export actual scanner results (fail below ATC target universe)
        shell: bash
        run: |
          python scripts/atc_export_dashboard.py \
            --universe BIST_ALL \
            --require-members "$ATC_REQUIRED_MEMBERS" \
            --output runtime_artifacts/ATC_Tarama_Matris.csv
      - name: Validate fresh daily scan coverage and optionally queue report
        shell: bash
        run: |
          set -euo pipefail
          notify_flag=()
          if [ "$DELIVERY_MODE" = "live" ]; then
            if [ "${{ github.event_name }}" = "schedule" ] && [ "$ATC_SCHEDULED_NOTIFY" = "true" ]; then
              notify_flag=(--queue-telegram)
            elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$ATC_MANUAL_NOTIFY" = "true" ]; then
              notify_flag=(--queue-telegram)
            fi
          fi
          python scripts/atc_cloud_summary.py \
            --csv runtime_artifacts/ATC_Tarama_Matris.csv \
            --min-fresh-ratio 0.95 "${notify_flag[@]}"
          if [ ${#notify_flag[@]} -gt 0 ]; then
            borsapp publisher-once --limit 20
          fi
      - name: Upload CSV only when public artifact exposure is explicitly approved
        if: ${{ vars.ATC_SHARE_CSV_ARTIFACT == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: atc-cloud-csv-${{ github.run_id }}
          path: runtime_artifacts/ATC_Tarama_Matris.csv
          retention-days: 7
          if-no-files-found: error
