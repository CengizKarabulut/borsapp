name: ATC confirmed Kesisim multi-timeframe PNG and full CSV

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1-5"
  push:
    branches: [fix/atc-recovery-multitf-intersections-20261015]
    paths: [.github/workflows/atc-confirmed-intersections.yml]

permissions:
  contents: read

concurrency:
  group: atc-confirmed-cross-timeframe
  cancel-in-progress: false

jobs:
  kesisim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      APP_TIMEZONE: Europe/Istanbul
      BORSAPP_REPOSITORY_ROOT: ${{ github.workspace }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DELIVERY_MODE: disabled
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USERS: ${{ vars.TELEGRAM_ALLOWED_USERS }}
      TELEGRAM_TOPIC_COMMAND: ${{ vars.TELEGRAM_TOPIC_COMMAND }}
      TELEGRAM_TOPIC_SCANS: ${{ vars.TELEGRAM_TOPIC_SCANS }}
      TELEGRAM_TOPIC_ANALYSIS: ${{ vars.TELEGRAM_TOPIC_ANALYSIS }}
      TELEGRAM_TOPIC_CHARTS: ${{ vars.TELEGRAM_TOPIC_CHARTS }}
      TELEGRAM_TOPIC_NEWS: ${{ vars.TELEGRAM_TOPIC_NEWS }}
      TELEGRAM_TOPIC_CALENDAR: ${{ vars.TELEGRAM_TOPIC_CALENDAR }}
      TELEGRAM_TOPIC_REPORTS: ${{ vars.TELEGRAM_TOPIC_REPORTS }}
      TELEGRAM_TOPIC_SYSTEM: ${{ vars.TELEGRAM_TOPIC_SYSTEM }}
      TELEGRAM_TOPIC_INTERSECTIONS: ${{ vars.TELEGRAM_TOPIC_INTERSECTIONS || secrets.TELEGRAM_TOPIC_INTERSECTIONS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original 18-scanner catalog, PostgreSQL and Pillow
        run: python -m pip install --editable ".[runtime,atcdata]"
      - name: Publish ONLY fresh, confirmed 1h and 1d multi-rule intersection
        run: python -m scripts.atc_confirmed_intersections --timeframes 1h,1d
