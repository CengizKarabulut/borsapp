name: ATC 630 morning support resistance and pivot report

on:
  workflow_dispatch:
  schedule:
    # 08:35 Europe/Istanbul, weekdays; no Neon database.
    - cron: "35 5 * * 1-5"

permissions:
  contents: read

concurrency:
  group: atc-ephemeral-morning-report
  cancel-in-progress: false

jobs:
  real-morning:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      APP_ENV: production
      APP_TIMEZONE: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install real BIST source and daily structure report runtime
        run: python -m pip install --editable ".[runtime,atcdata]"
      - name: Prepare all 630 previous-session reference pivots and structural levels
        run: python -m scripts.atc_structure_report --prepare --workers 2 --output-dir runtime_artifacts/structure
      - name: Publish the prepared daily report to the existing Reports topic
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOPIC_REPORTS: ${{ vars.TELEGRAM_TOPIC_REPORTS }}
        run: python -m scripts.atc_structure_report --publish-from runtime_artifacts/structure
      - name: Retain prepared report and actual Telegram acknowledgements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atc-morning-support-pivot-report
          path: |
            runtime_artifacts/structure/report.json
            runtime_artifacts/structure/report.csv
            runtime_artifacts/structure/summary.txt
            runtime_artifacts/structure/summary.png
            runtime_artifacts/structure/manifest.json
            runtime_artifacts/structure/delivery.json
          retention-days: 2
          if-no-files-found: warn
