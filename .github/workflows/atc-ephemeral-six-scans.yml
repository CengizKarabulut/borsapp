name: ATC six timeframe real scan in FREE isolated PostgreSQL runner

on:
  workflow_dispatch:
  push:
    branches: [feat/atc-ephemeral-timeframe-scans-20261015]
    paths: [.github/workflows/atc-ephemeral-six-scans.yml]

permissions:
  contents: read

concurrency:
  group: atc-ephemeral-six-timeframe-scan
  cancel-in-progress: false

jobs:
  real-scan-and-telegram:
    strategy:
      fail-fast: false
      max-parallel: 6
      # On this recovery-branch push, retry ONLY failed timeframes: do not
      # duplicate confirmed 30m/2h/4h Telegram messages from run 38751800120.
      # Manual dispatch runs all six timeframes concurrently.
      matrix:
        timeframe: ${{ fromJSON(github.event_name == 'push' && '["15m","45m","1wk"]' || '["15m","30m","45m","2h","4h","1wk"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atc_ephemeral
          POSTGRES_PASSWORD: ephemeral_runner_password
          POSTGRES_DB: atc_scan
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atc_ephemeral -d atc_scan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The public credentials below belong ONLY to the throwaway Actions
      # PostgreSQL service; Neon DATABASE_URL secret is never used in this job.
      DATABASE_URL: postgresql://atc_ephemeral:ephemeral_runner_password@localhost:5432/atc_scan
      APP_ENV: production
      APP_TIMEZONE: Europe/Istanbul
      BORSAPP_REPOSITORY_ROOT: ${{ github.workspace }}
      DELIVERY_MODE: disabled
      ATC_SCAN_TIMEFRAME: ${{ matrix.timeframe }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ALLOWED_USERS: ${{ vars.TELEGRAM_ALLOWED_USERS }}
      TELEGRAM_TOPIC_COMMAND: ${{ vars.TELEGRAM_TOPIC_COMMAND }}
      TELEGRAM_TOPIC_SCANS: ${{ vars.TELEGRAM_TOPIC_SCANS }}
      TELEGRAM_TOPIC_ANALYSIS: ${{ vars.TELEGRAM_TOPIC_ANALYSIS }}
      TELEGRAM_TOPIC_CHARTS: ${{ vars.TELEGRAM_TOPIC_CHARTS }}
      TELEGRAM_TOPIC_NEWS: ${{ vars.TELEGRAM_TOPIC_NEWS }}
      TELEGRAM_TOPIC_CALENDAR: ${{ vars.TELEGRAM_TOPIC_CALENDAR }}
      TELEGRAM_TOPIC_REPORTS: ${{ vars.TELEGRAM_TOPIC_REPORTS }}
      TELEGRAM_TOPIC_SYSTEM: ${{ vars.TELEGRAM_TOPIC_SYSTEM }}
      TELEGRAM_TIMEFRAME_TOPICS: ${{ vars.TELEGRAM_TIMEFRAME_TOPICS || secrets.TELEGRAM_TIMEFRAME_TOPICS }}
      TELEGRAM_TOPIC_15M: ${{ vars.TELEGRAM_TOPIC_15M || secrets.TELEGRAM_TOPIC_15M }}
      TELEGRAM_TOPIC_30M: ${{ vars.TELEGRAM_TOPIC_30M || secrets.TELEGRAM_TOPIC_30M }}
      TELEGRAM_TOPIC_45M: ${{ vars.TELEGRAM_TOPIC_45M || secrets.TELEGRAM_TOPIC_45M }}
      TELEGRAM_TOPIC_120M: ${{ vars.TELEGRAM_TOPIC_120M || secrets.TELEGRAM_TOPIC_120M }}
      TELEGRAM_TOPIC_2H: ${{ vars.TELEGRAM_TOPIC_2H || secrets.TELEGRAM_TOPIC_2H }}
      TELEGRAM_TOPIC_4H: ${{ vars.TELEGRAM_TOPIC_4H || secrets.TELEGRAM_TOPIC_4H }}
      TELEGRAM_TOPIC_240M: ${{ vars.TELEGRAM_TOPIC_240M || secrets.TELEGRAM_TOPIC_240M }}
      TELEGRAM_TOPIC_1WK: ${{ vars.TELEGRAM_TOPIC_1WK || secrets.TELEGRAM_TOPIC_1WK }}
      TELEGRAM_TOPIC_HAFTALIK: ${{ vars.TELEGRAM_TOPIC_HAFTALIK || secrets.TELEGRAM_TOPIC_HAFTALIK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install original 18 ATC scanner rules and free market data adapters
        run: python -m pip install --editable ".[runtime,atcdata]"
      - name: Migrate isolated PostgreSQL, never connect to cloud Neon
        run: borsapp db-migrate
      - name: Seed exact 630 pinned symbols directly, with no fabricated prices
        run: python -m scripts.atc_ephemeral_universe
      - name: Fetch genuine completed candles and run original 18 scanners
        run: |
          lookback=1
          # On Thursdays the current weekly bar has not closed. Select the
          # most recent REAL confirmed Friday candle, never fabricate one.
          if [ "$ATC_SCAN_TIMEFRAME" = "1wk" ]; then lookback=7; fi
          # Six parallel jobs x two workers: fewer concurrent provider
          # requests than the previous two jobs x eight workers.
          borsapp scan-due --universe ATC_630 --timeframe "$ATC_SCAN_TIMEFRAME" --bars 600 --workers 2 --lookback-days "$lookback"
      - name: Send PNG cards and FULL CSV directly to its preexisting Telegram topic
        run: python -m scripts.atc_timeframe_visuals --timeframe "$ATC_SCAN_TIMEFRAME"
