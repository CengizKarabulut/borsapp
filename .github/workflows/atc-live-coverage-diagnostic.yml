name: ATC eight-timeframe real coverage diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main, fix/atc-live-eight-timeframes-20261015]
    paths: [.github/workflows/atc-live-coverage-diagnostic.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENABLE_SCHEDULED_SCANS: ${{ vars.ENABLE_SCHEDULED_SCANS }}
      ENABLE_TIMEFRAME_IMAGE_REPORTS: ${{ vars.ENABLE_TIMEFRAME_IMAGE_REPORTS }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]>=3,<4'
      - name: Inspect real persisted bar coverage and Telegram delivery (READ ONLY)
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import psycopg

          url = os.environ.get('DATABASE_URL')
          if not url:
              raise SystemExit('PostgreSQL secret missing')
          local = datetime.now(ZoneInfo('Europe/Istanbul'))
          print('ATC coverage diagnostic as of', local.isoformat())
          flag = os.environ.get('ENABLE_SCHEDULED_SCANS','')
          print('ENABLE_SCHEDULED_SCANS:', 'false (explicitly disabled)' if flag.lower() == 'false' else 'not explicitly disabled')
          flag2 = os.environ.get('ENABLE_TIMEFRAME_IMAGE_REPORTS','')
          print('ENABLE_TIMEFRAME_IMAGE_REPORTS:', 'false (explicitly disabled)' if flag2.lower() == 'false' else 'not explicitly disabled')
          sql = """
          WITH latest AS (
            SELECT e.timeframe, MAX(e.bar_time) AS last_bar
            FROM scan_evaluations e
            JOIN scan_cycles c ON c.cycle_id=e.cycle_id
            WHERE c.universe_id='ATC_630'
              AND c.status IN ('completed','completed_with_errors')
            GROUP BY e.timeframe
          )
          SELECT l.timeframe, l.last_bar, COUNT(DISTINCT e.instrument_id) AS covered,
                 COUNT(*) AS evaluated,
                 COUNT(*) FILTER (WHERE e.status='match') AS matched,
                 COUNT(*) FILTER (WHERE e.status='unknown') AS unknown
          FROM latest l
          JOIN scan_evaluations e ON e.timeframe=l.timeframe AND e.bar_time=l.last_bar
          JOIN scan_cycles c ON c.cycle_id=e.cycle_id
          WHERE c.universe_id='ATC_630'
            AND c.status IN ('completed','completed_with_errors')
          GROUP BY l.timeframe, l.last_bar ORDER BY l.timeframe
          """
          with psycopg.connect(url, connect_timeout=20) as db:
              rows=db.execute(sql).fetchall()
              cycles=db.execute("""
                SELECT timeframe, bar_time, status, expected_instruments,
                       successful_instruments, failed_instruments, started_at
                FROM scan_cycles
                WHERE universe_id='ATC_630'
                ORDER BY started_at DESC LIMIT 12
              """).fetchall()
              errors=db.execute("""
                SELECT f.error_code, count(*)
                FROM scan_cycle_failures f
                JOIN scan_cycles c ON c.cycle_id=f.cycle_id
                WHERE c.universe_id='ATC_630'
                  AND c.started_at > now()-interval '2 hours'
                GROUP BY f.error_code ORDER BY count(*) DESC LIMIT 8
              """).fetchall()
              recent=db.execute("""
                SELECT message_thread_id, status, count(*), max(created_at)
                FROM telegram_outbox
                WHERE chat_id=%s
                  AND created_at >= now()-interval '3 days'
                  AND payload->'message'->>'filename' LIKE 'ATC_%%'
                GROUP BY message_thread_id, status
                ORDER BY message_thread_id, status
              """, (os.environ.get('TELEGRAM_CHAT_ID'),)).fetchall()
          print('Recent ATC scan cycle progress:')
          for tf, bar_time, state, expected, successful, failed, started in cycles:
              print(f'cycle tf={tf} bar={bar_time} state={state} expected={expected} '
                    f'success={successful} failed={failed} started={started}')
          print('Recent failure codes:', [(str(code), int(count)) for code, count in errors])
          print('Latest actual ATC scan_evaluations by timeframe:')
          for tf, close, members, evaluations, matches, unknown in rows:
              print(f'timeframe={tf} last_bar={close} members={members}/630 '
                    f'evaluations={evaluations} matches={matches} unknown={unknown}')
          print('Last 3 days ATC media delivery states:')
          for thread, state, count, created in recent:
              print(f'topic={thread} state={state} count={count} last={created}')
          with psycopg.connect(url, connect_timeout=20) as db:
              sent=db.execute("""
                SELECT message_thread_id, telegram_message_id,
                       payload->'message'->>'filename'
                FROM telegram_outbox
                WHERE chat_id=%s AND status='sent'
                  AND message_thread_id=28328
                  AND sent_at >= now()-interval '6 hours'
                  AND payload->'message'->>'filename' LIKE 'ATC_1d_%%'
                ORDER BY sent_at ASC LIMIT 20
              """, (os.environ.get('TELEGRAM_CHAT_ID'),)).fetchall()
          print('Confirmed daily photos and complete CSV Telegram links:')
          for thread, message_id, filename in sent:
              if message_id:
                  print(f'{filename} https://t.me/c/4439315048/{thread}/{message_id}')
          PY
