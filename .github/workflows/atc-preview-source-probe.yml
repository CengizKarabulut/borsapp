name: ATC investigate live intraday preview source failures (no publishing)

on:
  workflow_dispatch:
  push:
    branches: [fix/atc-recovery-multitf-intersections-20261015]
    paths: [.github/workflows/atc-preview-source-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      APP_TIMEZONE: Europe/Istanbul
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BORSAPP_REPOSITORY_ROOT: ${{ github.workspace }}
      DELIVERY_MODE: disabled
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USERS: ${{ vars.TELEGRAM_ALLOWED_USERS }}
      TELEGRAM_TOPIC_COMMAND: ${{ vars.TELEGRAM_TOPIC_COMMAND }}
      TELEGRAM_TOPIC_SCANS: ${{ vars.TELEGRAM_TOPIC_SCANS }}
      TELEGRAM_TOPIC_ANALYSIS: ${{ vars.TELEGRAM_TOPIC_ANALYSIS }}
      TELEGRAM_TOPIC_CHARTS: ${{ vars.TELEGRAM_TOPIC_CHARTS }}
      TELEGRAM_TOPIC_NEWS: ${{ vars.TELEGRAM_TOPIC_NEWS }}
      TELEGRAM_TOPIC_CALENDAR: ${{ vars.TELEGRAM_TOPIC_CALENDAR }}
      TELEGRAM_TOPIC_REPORTS: ${{ vars.TELEGRAM_TOPIC_REPORTS }}
      TELEGRAM_TOPIC_SYSTEM: ${{ vars.TELEGRAM_TOPIC_SYSTEM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual vendor adapters and DB
        run: python -m pip install --editable ".[runtime,atcdata]"
      - name: Analyze 70 spaced-out live symbols with no Telegram send
        run: |
          python - <<'PY'
          import os
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import psycopg
          from market_intelligence.persistence.postgres.runtime import PostgresRuntimeRepository
          from market_intelligence.settings import ApplicationSettings
          from scripts.atc_telegram_briefings import make_daily_preview_frame

          now=datetime.now(ZoneInfo('Europe/Istanbul'))
          settings=ApplicationSettings.from_mapping(os.environ)
          with psycopg.connect(os.environ['DATABASE_URL']) as db:
              members=PostgresRuntimeRepository(db).list_universe('ATC_630',as_of=now.date())
          subset=tuple(members[::9][:70])
          results=Counter()
          examples={}
          def probe(member):
              with psycopg.connect(os.environ['DATABASE_URL'],autocommit=True) as db:
                  make_daily_preview_frame(db,member,settings,now=now)
              return 'OK', ''
          with ThreadPoolExecutor(max_workers=6) as pool:
              futures={pool.submit(probe,m):m.symbol for m in subset}
              for future in as_completed(futures):
                  try:
                      key,detail=future.result()
                  except Exception as exc:
                      key=type(exc).__name__
                      detail=str(exc)
                  for secret in ('DATABASE_URL','TELEGRAM_BOT_TOKEN'):
                      value=os.getenv(secret,'')
                      if value:
                          detail=detail.replace(value,'[REDACTED]')
                  results[(key,detail[:130])]+=1
                  examples.setdefault((key,detail[:130]),futures[future])
          print('Read-only provisional provider probe:',len(subset),'equities')
          for (key,detail),count in results.most_common(15):
              print(f'{count:02d} {key}: {detail} (e.g. {examples[key,detail]})')
          PY
