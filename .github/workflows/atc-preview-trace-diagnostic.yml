name: ATC preview full-stack failure diagnosis (single equity, no publishing)

on:
  workflow_dispatch:
  push:
    branches: [fix/atc-recovery-multitf-intersections-20261015]
    paths: [.github/workflows/atc-preview-trace-diagnostic.yml]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: production
      APP_TIMEZONE: Europe/Istanbul
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BORSAPP_REPOSITORY_ROOT: ${{ github.workspace }}
      DELIVERY_MODE: disabled
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ALLOWED_USERS: ${{ vars.TELEGRAM_ALLOWED_USERS }}
      TELEGRAM_TOPIC_COMMAND: ${{ vars.TELEGRAM_TOPIC_COMMAND }}
      TELEGRAM_TOPIC_SCANS: ${{ vars.TELEGRAM_TOPIC_SCANS }}
      TELEGRAM_TOPIC_ANALYSIS: ${{ vars.TELEGRAM_TOPIC_ANALYSIS }}
      TELEGRAM_TOPIC_CHARTS: ${{ vars.TELEGRAM_TOPIC_CHARTS }}
      TELEGRAM_TOPIC_NEWS: ${{ vars.TELEGRAM_TOPIC_NEWS }}
      TELEGRAM_TOPIC_CALENDAR: ${{ vars.TELEGRAM_TOPIC_CALENDAR }}
      TELEGRAM_TOPIC_REPORTS: ${{ vars.TELEGRAM_TOPIC_REPORTS }}
      TELEGRAM_TOPIC_SYSTEM: ${{ vars.TELEGRAM_TOPIC_SYSTEM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --editable ".[runtime,atcdata]"
      - name: Reproduce failing real scanner with timezone-aware full 600 bars
        run: |
          python - <<'PY'
          import os
          import traceback
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import psycopg
          from market_intelligence.persistence.postgres.runtime import PostgresRuntimeRepository
          from market_intelligence.persistence.postgres.snapshots import PostgresSnapshotStore
          from market_intelligence.scanning.catalog import load_scanner_catalog
          from market_intelligence.scheduling.xist import ExchangeCalendarsXist
          from market_intelligence.settings import ApplicationSettings
          from scripts.atc_telegram_briefings import preview_for_member
          now=datetime.now(ZoneInfo('Europe/Istanbul'))
          settings=ApplicationSettings.from_mapping(os.environ)
          calendar=ExchangeCalendarsXist()
          bindings=load_scanner_catalog(Path('config/scanners.toml'),calendar_version=calendar.version)
          with psycopg.connect(os.environ['DATABASE_URL']) as db:
              members=PostgresRuntimeRepository(db).list_universe('ATC_630',as_of=now.date())
              store=PostgresSnapshotStore(db)
              picked=None
              for member in members[:50]:
                  cache=store.load_recent_bars(instrument_id=member.instrument_id,
                                               as_of=now,timeframe='1d',limit=600)
                  if cache and len(cache.bars)>=590:
                      picked=member
                      break
          if picked is None:
              raise SystemExit('No full history in first 50; no test performed')
          print('Testing full preview for',picked.symbol,flush=True)
          try:
              symbol,results=preview_for_member(
                  picked,settings=settings,now=now,bindings=bindings,
                  calendar_version=calendar.version
              )
              print('Preview scanner success:',symbol,'matched conditions=',len(results))
          except Exception as exc:
              report=''.join(traceback.format_exception(exc))
              for name in ('DATABASE_URL','TELEGRAM_BOT_TOKEN'):
                  private=os.getenv(name,'')
                  if private:
                      report=report.replace(private,'[REDACTED]')
              print('SANITIZED PREVIEW ERROR STACK:',report[-9000:],flush=True)
          PY
