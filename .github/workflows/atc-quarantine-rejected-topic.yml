name: ATC quarantine rejected visual messages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/atc-quarantine-rejected-topic.yml]

permissions:
  contents: read

jobs:
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client only
        run: python -m pip install "psycopg[binary]>=3,<4"
      - name: Prevent retries of only the known rejected 1d thread
        run: |
          python - <<'PY'
          import os
          import psycopg

          if not os.getenv("DATABASE_URL") or not os.getenv("TELEGRAM_CHAT_ID"):
              raise SystemExit("Required secrets missing")
          # Preserve records and diagnostic errors. Exclude them only from
          # retry selection; never affect older or unrelated Telegram messages.
          sql = """
          UPDATE telegram_outbox
          SET available_at='infinity'::timestamptz
          WHERE chat_id=%s
            AND message_thread_id=328
            AND status='failed'
            AND last_error LIKE '%%message thread not found%%'
            AND created_at >= now()-interval '24 hours'
            AND payload->'message'->>'filename' LIKE 'ATC_1d_%%'
          RETURNING outbox_id
          """
          with psycopg.connect(os.environ["DATABASE_URL"]) as db:
              ids = db.execute(sql, (os.environ["TELEGRAM_CHAT_ID"],)).fetchall()
          print(f"Quarantined known-invalid ATC 1d image/CSV retries: {len(ids)}")
          print("No messages deleted and no other Telegram outbox rows changed.")
          PY
