name: ATC real OHLC Stop TP root cause diagnosis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/atc-real-ohlc-diagnosis.yml]

permissions:
  contents: read

jobs:
  inspect-original-pine-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual BIST data adapters and Pine-compatible formulas
        run: python -m pip install --editable ".[runtime,atcdata]"
      - name: Refetch genuine OHLCV from independent vendors for all 22 failed plans
        run: python -m scripts.atc_real_ohlcv_diagnose
      - name: Preserve 22-case OHLCV, ATR, risk and target audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atc-22-real-ohlcv-diagnosis
          path: runtime_artifacts/atc_22_real_ohlc_diagnosis.json
          retention-days: 7
          if-no-files-found: warn
