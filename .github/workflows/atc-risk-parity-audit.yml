name: ATC risk parity audit tests

on:
  push:
    branches: [atc-stop-tp-pine-parity-audit-20261017]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  risk-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner package
        run: python -m pip install --editable .
      - name: Run risk boundary regressions
        run: python -m unittest discover -s tests -p test_atc_risk_parity_audit.py -v
