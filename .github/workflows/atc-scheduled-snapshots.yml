name: ATC automatic latest candle snapshots

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Latest due exchange slots, or all supported timeframes once
        required: true
        type: choice
        options: [due, all]
        default: due
      delivery:
        description: Preview creates files only; publish sends to existing timeframe topics
        required: true
        type: choice
        options: [preview, publish]
        default: preview
  schedule:
    # UTC; Istanbul = UTC+3. The planner chooses actual BIST-session slots.
    - cron: "7,22,37,52 7-14 * * 1-5"
    - cron: "30 15 * * 1-5"

permissions:
  contents: read
  actions: read

# Keep an in-flight publication intact. GitHub may replace an older pending
# run with a newer one; the planner uses the latest slot instead of a backlog.
concurrency:
  group: atc-automatic-latest-candle-snapshots
  cancel-in-progress: false

jobs:
  choose-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Require main for Telegram publication
        if: ${{ (github.event_name == 'schedule' || inputs.delivery == 'publish') && github.ref != 'refs/heads/main' }}
        run: echo 'Publication requires main; use preview on development branches.' && exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install scheduler and receipt reader without a database
        run: python -m pip install --editable . 'exchange-calendars>=4.13,<5' 'httpx>=0.27,<1'
      - name: Restore only acknowledged deliveries from this workflow on main
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.atc_schedule_receipts --restore --repository "$GITHUB_REPOSITORY" --workflow atc-scheduled-snapshots.yml --output-dir runtime_artifacts/ledger
      - name: Select the latest due exchange slot in each timeframe
        id: pick
        env:
          INPUT_SCOPE: ${{ inputs.scope || 'due' }}
        shell: bash
        run: |
          if [ "$INPUT_SCOPE" = all ]; then
            python -m scripts.atc_snapshot_schedule --ledger-dir runtime_artifacts/ledger --all
          else
            python -m scripts.atc_snapshot_schedule --ledger-dir runtime_artifacts/ledger
          fi
      - name: Report unsupported shortened exchange sessions explicitly
        if: ${{ steps.pick.outputs.plan_status == 'unsupported_partial_session' }}
        run: echo '::error::The current RAM adapter cannot evaluate this shortened exchange session.' && exit 1

  live-snapshot:
    needs: choose-snapshots
    if: ${{ needs.choose-snapshots.outputs.matrix != '' && needs.choose-snapshots.outputs.matrix != '[]' }}
    name: Latest ${{ matrix.timeframe }} candle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.choose-snapshots.outputs.matrix) }}
    env:
      APP_TIMEZONE: Europe/Istanbul
      TZ: UTC
      SNAPSHOT_TIMEFRAME: ${{ matrix.timeframe }}
      SCHEDULE_SLOT: ${{ toJSON(matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install market data and in-memory scan runtime
        run: python -m pip install --editable '.[runtime,atcdata]'
      - name: Prepare all 630 stocks from their actual latest candles
        run: python -m scripts.atc_live_snapshot --prepare --timeframe "$SNAPSHOT_TIMEFRAME" --workers 2 --output-dir runtime_artifacts/live
      - name: Attach scheduling context without changing prepared report bytes
        run: python -m scripts.atc_schedule_receipts --stamp-packet --packet-dir runtime_artifacts/live --slot-json "$SCHEDULE_SLOT"
      - name: Show the selected slot and actual data coverage
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('runtime_artifacts/live')
          slot = json.loads((root / 'scheduled-slot.json').read_bytes())
          text = (root / 'live-snapshot.txt').read_text(encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Latest actual candle / provisional scan\n\n')
              out.write('Scheduled slot metadata (not the market-data timestamp):\n\n')
              out.write('```json\n' + json.dumps(slot, ensure_ascii=False, indent=2) + '\n```\n\n')
              out.write('Actual provider coverage and candle observations:\n\n```text\n' + text + '\n```\n')
          print(json.dumps(slot, ensure_ascii=False))
          print(text)
          PY
      - name: Publish the verified provisional packet to its existing timeframe topic
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.delivery == 'publish') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TIMEFRAME_TOPICS: ${{ vars.TELEGRAM_TIMEFRAME_TOPICS || secrets.TELEGRAM_TIMEFRAME_TOPICS }}
          TELEGRAM_TOPIC_15M: ${{ vars.TELEGRAM_TOPIC_15M || secrets.TELEGRAM_TOPIC_15M }}
          TELEGRAM_TOPIC_30M: ${{ vars.TELEGRAM_TOPIC_30M || secrets.TELEGRAM_TOPIC_30M }}
          TELEGRAM_TOPIC_45M: ${{ vars.TELEGRAM_TOPIC_45M || secrets.TELEGRAM_TOPIC_45M }}
          TELEGRAM_TOPIC_1H: ${{ vars.TELEGRAM_TOPIC_1H || secrets.TELEGRAM_TOPIC_1H }}
          TELEGRAM_TOPIC_2H: ${{ vars.TELEGRAM_TOPIC_2H || secrets.TELEGRAM_TOPIC_2H }}
          TELEGRAM_TOPIC_4H: ${{ vars.TELEGRAM_TOPIC_4H || secrets.TELEGRAM_TOPIC_4H }}
          TELEGRAM_TOPIC_1D: ${{ vars.TELEGRAM_TOPIC_1D || secrets.TELEGRAM_TOPIC_1D }}
        run: python -m scripts.atc_live_snapshot --publish-from runtime_artifacts/live
      - name: Record this slot only after all Telegram parts were acknowledged
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.delivery == 'publish') }}
        run: python -m scripts.atc_schedule_receipts --record --packet-dir runtime_artifacts/live --slot-json "$SCHEDULE_SLOT" --output-dir runtime_artifacts/state
      - name: Retain acknowledged delivery state for subsequent scheduling
        if: ${{ always() && hashFiles('runtime_artifacts/state/*.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: atc-scheduled-delivery-${{ matrix.timeframe }}
          path: runtime_artifacts/state/${{ matrix.timeframe }}.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Retain reports, schedule context and acknowledgement files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atc-scheduled-snapshot-${{ matrix.timeframe }}
          path: |
            runtime_artifacts/live/live-snapshot.json
            runtime_artifacts/live/live-snapshot.csv
            runtime_artifacts/live/live-snapshot.txt
            runtime_artifacts/live/live-snapshot.png
            runtime_artifacts/live/prepared-packet.json
            runtime_artifacts/live/publication-receipt.json
            runtime_artifacts/live/scheduled-slot.json
          retention-days: 2
          if-no-files-found: warn

  latest-intersections:
    needs: [choose-snapshots, live-snapshot]
    if: ${{ always() && needs.choose-snapshots.result == 'success' && needs.choose-snapshots.outputs.matrix != '' && needs.choose-snapshots.outputs.matrix != '[]' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.delivery == 'publish') }}
    name: All latest-state intersection stocks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install read-only intersection and Telegram runtime
        run: python -m pip install --editable '.[runtime,atcdata]'
      - name: Restore acknowledged main packets and previous intersection acknowledgement
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.atc_live_packet_restore --repository "$GITHUB_REPOSITORY" --output-dir runtime_artifacts/inputs
      - name: Prepare latest known same-session intersections and all image pages
        run: python -m scripts.atc_live_intersections --prepare --packets-dir runtime_artifacts/inputs --sources-manifest runtime_artifacts/inputs/source-runs.json --output-dir runtime_artifacts/intersections
      - name: Show actual included sources and intersection coverage
        run: cat runtime_artifacts/intersections/intersections.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Send text and every intersection image page to the existing topic
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_INTERSECTIONS: '28330'
        shell: bash
        run: |
          args=()
          if [ -f runtime_artifacts/inputs/previous-intersection-receipt.json ]; then
            args+=(--previous-receipt runtime_artifacts/inputs/previous-intersection-receipt.json)
          fi
          python -m scripts.atc_live_intersections --publish-from runtime_artifacts/intersections "${args[@]}"
      - name: Retain intersection delivery acknowledgement for duplicate prevention
        if: ${{ always() && hashFiles('runtime_artifacts/intersections/publication-receipt.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: atc-scheduled-intersection-delivery
          path: runtime_artifacts/intersections/publication-receipt.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Retain all intersection images, full list and source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atc-scheduled-intersections
          path: |
            runtime_artifacts/intersections/*
            runtime_artifacts/inputs/source-runs.json
          retention-days: 7
          if-no-files-found: warn
