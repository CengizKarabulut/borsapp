name: ATC stop initial six-timeframe seed after database quota breach

on:
  workflow_dispatch:
  push:
    branches: [fix/atc-recovery-multitf-intersections-20261015]
    paths: [.github/workflows/atc-stop-overquota-seed.yml]

permissions:
  contents: read

# Cross-workflow concurrency: cancel the old six-timeframe seed workflow
# immediately. Its confirmed 30m job hit Neon free 1024 MB storage limit.
concurrency:
  group: atc-seed-missing-timeframes
  cancel-in-progress: true

jobs:
  stop-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "Initial seed cancelled to avoid more BIST snapshot writes."
          echo "Neon storage quota reached; require DB capacity verification before resuming."
