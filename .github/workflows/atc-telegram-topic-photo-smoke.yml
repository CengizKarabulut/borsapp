name: ATC verify supplied existing Telegram topics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/atc-telegram-topic-photo-smoke.yml]

permissions:
  contents: read

jobs:
  smoke-existing-topics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      APP_TIMEZONE: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python Telegram and image clients
        run: python -m pip install --editable . "httpx>=0.27,<1" "Pillow>=10,<12"
      - name: Send one unmistakable topic-routing test to each USER-LINKED topic
        run: |
          python - <<'PY'
          import base64
          import io
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          from PIL import Image, ImageDraw
          from market_intelligence.core.timeframes import Timeframe
          from market_intelligence.delivery.telegram.http_transport import HttpxTelegramTransport
          from market_intelligence.delivery.telegram.timeframe_topics import (
              existing_intersection_topic_id,
              timeframe_topic_ids,
          )

          chat = os.getenv("TELEGRAM_CHAT_ID", "").strip()
          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          if chat != "-1004439315048" or not token:
              raise SystemExit("Verified original Telegram forum and token are required")

          mapping = timeframe_topic_ids(os.environ)
          cross = existing_intersection_topic_id(os.environ)
          expected = (
              ("60 DK", mapping[Timeframe.H1], 28326),
              ("GUNLUK", mapping[Timeframe.D1], 28328),
              ("HAFTALIK", mapping[Timeframe.W1], 28329),
              ("KESISIM", cross, 28330),
          )
          sender = HttpxTelegramTransport(token)
          at = datetime.now(ZoneInfo("Europe/Istanbul")).strftime("%d.%m.%Y %H:%M TSİ")
          failures = []
          for label, thread_id, verified_id in expected:
              if thread_id != verified_id:
                  raise SystemExit("Wrong Telegram topic mapping for " + label)
              if label == "GUNLUK":
                  picture = Image.new("RGB", (920, 240), "#edf2f7")
                  draw = ImageDraw.Draw(picture)
                  draw.rectangle((0, 0, 920, 66), fill="#152f48")
                  draw.text((30, 22), "ALPHA TREND CIPHER / ROUTING TEST", fill="#ffffff")
                  draw.text((30, 103), "GUNLUK TOPIC - TEST IMAGE / NO MARKET SIGNAL", fill="#1e344a")
                  draw.text((30, 167), at, fill="#365773")
                  stream = io.BytesIO()
                  picture.save(stream, format="PNG")
                  payload = {
                      "_method": "sendPhoto",
                      "photo_base64": base64.b64encode(stream.getvalue()).decode(),
                      "filename": "ATC_GUNLUK_TOPIC_TEST.png",
                      "caption": (
                          "ATC GÜNLÜK: Telegram konu bağlantısı testidir. "
                          "Piyasa verisi veya tarama sinyali içermez."
                      ),
                  }
              else:
                  payload = {
                      "text": (
                          f"ATC {label}: Mevcut Telegram konu bağlantısı testi. "
                          "Piyasa verisi veya tarama sinyali içermez."
                      )
                  }
              try:
                  message_id = sender.send(
                      chat_id=int(chat), message_thread_id=thread_id,
                      payload=payload,
                  )
                  print(f"VERIFIED {label}: topic={thread_id}, message={message_id}; "
                        f"https://t.me/c/4439315048/{thread_id}/{message_id}", flush=True)
              except Exception as exc:
                  # Never print token, private messages or raw payload.
                  reason = str(exc).replace(token, "[REDACTED]")[:160]
                  failures.append(label)
                  print(f"FAILED {label} thread={thread_id}: {type(exc).__name__}: {reason}", flush=True)
          if failures:
              raise SystemExit("Telegram topic smoke failed: " + ", ".join(failures))
          PY
