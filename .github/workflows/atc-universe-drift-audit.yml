name: Maintenance - pinned 630 versus current BIST universe audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real BIST universe vendor adapter
        run: python -m pip install --editable ".[runtime,atcdata]"
      - name: Compare pinned ATC 630 with live XUTUM component snapshot
        run: python -m scripts.atc_universe_drift_report --out runtime_artifacts/universe_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atc-current-vendor-universe-comparison
          path: runtime_artifacts/universe_audit
          if-no-files-found: warn
          retention-days: 14
