name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --editable ".[dev]"
      - run: ruff check src tests scripts
      - run: python -m unittest discover -s tests -v

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t borsapp:ci .
      - run: docker run --rm borsapp:ci --help

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: borsapp_test
          POSTGRES_USER: borsapp
          POSTGRES_PASSWORD: borsapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U borsapp -d borsapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://borsapp:borsapp@localhost:5432/borsapp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --editable ".[runtime]"
      - run: python -m unittest discover -s tests/integration -v
