name: KAP news sync

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: KAP sorgusu için geriye bakış günü
        required: true
        default: "1"
        type: choice
        options: ["0", "1", "3", "7"]
  schedule:
    - cron: "*/10 6-20 * * 1-5"

permissions:
  contents: read

concurrency:
  group: borsapp-kap-news
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULED_NEWS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: shadow
      APP_TIMEZONE: ${{ vars.APP_TIMEZONE }}
      BORSAPP_REPOSITORY_ROOT: ${{ github.workspace }}
      DELIVERY_MODE: ${{ vars.NEWS_DELIVERY_MODE || 'disabled' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ALLOWED_USERS: ${{ vars.TELEGRAM_ALLOWED_USERS }}
      TELEGRAM_TOPIC_COMMAND: ${{ vars.TELEGRAM_TOPIC_COMMAND }}
      TELEGRAM_TOPIC_SCANS: ${{ vars.TELEGRAM_TOPIC_SCANS }}
      TELEGRAM_TOPIC_ANALYSIS: ${{ vars.TELEGRAM_TOPIC_ANALYSIS }}
      TELEGRAM_TOPIC_CHARTS: ${{ vars.TELEGRAM_TOPIC_CHARTS }}
      TELEGRAM_TOPIC_NEWS: ${{ vars.TELEGRAM_TOPIC_NEWS }}
      TELEGRAM_TOPIC_CALENDAR: ${{ vars.TELEGRAM_TOPIC_CALENDAR }}
      TELEGRAM_TOPIC_REPORTS: ${{ vars.TELEGRAM_TOPIC_REPORTS }}
      TELEGRAM_TOPIC_SYSTEM: ${{ vars.TELEGRAM_TOPIC_SYSTEM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Skip until PostgreSQL is configured
        if: ${{ env.DATABASE_URL == '' }}
        run: echo "DATABASE_URL secret is not configured; KAP sync skipped."
      - name: Install runtime
        if: ${{ env.DATABASE_URL != '' }}
        run: python -m pip install ".[runtime]"
      - name: Ensure database schema
        if: ${{ env.DATABASE_URL != '' }}
        run: borsapp db-init
      - name: Synchronize KAP disclosures
        if: ${{ env.DATABASE_URL != '' }}
        shell: bash
        env:
          MANUAL_LOOKBACK: ${{ inputs.lookback_days }}
        run: |
          lookback="1"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            lookback="$MANUAL_LOOKBACK"
          fi
          notify_args=()
          if [ "$DELIVERY_MODE" = "live" ]; then
            notify_args+=(--notify)
          fi
          borsapp news-kap-sync --lookback-days "$lookback" "${notify_args[@]}"
      - name: Synchronize general news and economic calendar
        if: ${{ env.DATABASE_URL != '' && vars.ENABLE_GENERAL_NEWS == 'true' }}
        shell: bash
        run: |
          notify_args=()
          if [ "$DELIVERY_MODE" = "live" ]; then
            notify_args+=(--notify)
          fi
          borsapp news-general-sync --lookback-days 1 "${notify_args[@]}"
