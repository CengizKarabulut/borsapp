name: Scheduled BIST scan

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Manual scan scope
        required: true
        default: symbol
        type: choice
        options: [symbol, due-universe]
      symbol:
        description: BIST symbol for a safe single-symbol smoke scan
        required: true
        default: ASELS
        type: string
      timeframe:
        description: Canonical timeframe
        required: true
        default: 1h
        type: choice
        options: [15m, 30m, 45m, 1h, 2h, 4h, 1d, 1wk]
      notify:
        description: Publish eligible findings (requires SCAN_DELIVERY_MODE=live)
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "*/15 7-14 * * 1-5"
    # 18:30 TRT after BIST closing auction; 18:00 TRT was too early.
    - cron: "30 15 * * 1-5"

permissions:
  contents: read

concurrency:
  group: borsapp-scan-${{ github.event_name }}-${{ inputs.symbol || 'scheduled' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULED_SCANS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: production
      APP_TIMEZONE: ${{ vars.APP_TIMEZONE }}
      BORSAPP_REPOSITORY_ROOT: ${{ github.workspace }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ALLOWED_USERS: ${{ vars.TELEGRAM_ALLOWED_USERS }}
      TELEGRAM_TOPIC_COMMAND: ${{ vars.TELEGRAM_TOPIC_COMMAND }}
      TELEGRAM_TOPIC_SCANS: ${{ vars.TELEGRAM_TOPIC_SCANS }}
      TELEGRAM_TOPIC_ANALYSIS: ${{ vars.TELEGRAM_TOPIC_ANALYSIS }}
      TELEGRAM_TOPIC_CHARTS: ${{ vars.TELEGRAM_TOPIC_CHARTS }}
      TELEGRAM_TOPIC_NEWS: ${{ vars.TELEGRAM_TOPIC_NEWS }}
      TELEGRAM_TOPIC_CALENDAR: ${{ vars.TELEGRAM_TOPIC_CALENDAR }}
      TELEGRAM_TOPIC_REPORTS: ${{ vars.TELEGRAM_TOPIC_REPORTS }}
      TELEGRAM_TOPIC_SYSTEM: ${{ vars.TELEGRAM_TOPIC_SYSTEM }}
      TELEGRAM_TIMEFRAME_TOPICS: ${{ vars.TELEGRAM_TIMEFRAME_TOPICS || secrets.TELEGRAM_TIMEFRAME_TOPICS }}
      TELEGRAM_TOPIC_15M: ${{ vars.TELEGRAM_TOPIC_15M || secrets.TELEGRAM_TOPIC_15M }}
      TELEGRAM_TOPIC_30M: ${{ vars.TELEGRAM_TOPIC_30M || secrets.TELEGRAM_TOPIC_30M }}
      TELEGRAM_TOPIC_45M: ${{ vars.TELEGRAM_TOPIC_45M || secrets.TELEGRAM_TOPIC_45M }}
      TELEGRAM_TOPIC_1H: ${{ vars.TELEGRAM_TOPIC_1H || secrets.TELEGRAM_TOPIC_1H }}
      TELEGRAM_TOPIC_60M: ${{ vars.TELEGRAM_TOPIC_60M || secrets.TELEGRAM_TOPIC_60M }}
      TELEGRAM_TOPIC_2H: ${{ vars.TELEGRAM_TOPIC_2H || secrets.TELEGRAM_TOPIC_2H }}
      TELEGRAM_TOPIC_4H: ${{ vars.TELEGRAM_TOPIC_4H || secrets.TELEGRAM_TOPIC_4H }}
      TELEGRAM_TOPIC_240M: ${{ vars.TELEGRAM_TOPIC_240M || secrets.TELEGRAM_TOPIC_240M }}
      TELEGRAM_TOPIC_1D: ${{ vars.TELEGRAM_TOPIC_1D || secrets.TELEGRAM_TOPIC_1D }}
      TELEGRAM_TOPIC_DAILY: ${{ vars.TELEGRAM_TOPIC_DAILY || secrets.TELEGRAM_TOPIC_DAILY }}
      TELEGRAM_TOPIC_1W: ${{ vars.TELEGRAM_TOPIC_1W || secrets.TELEGRAM_TOPIC_1W }}
      TELEGRAM_TOPIC_1WK: ${{ vars.TELEGRAM_TOPIC_1WK || secrets.TELEGRAM_TOPIC_1WK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Skip until PostgreSQL is configured
        if: ${{ env.DATABASE_URL == '' }}
        run: echo "DATABASE_URL secret is not configured; scan skipped."
      - name: Install runtime
        if: ${{ env.DATABASE_URL != '' }}
        run: python -m pip install ".[runtime,atcdata]"
      - name: Apply database migrations
        if: ${{ env.DATABASE_URL != '' }}
        run: borsapp db-migrate

  manual-scan:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_ENV: production
      APP_TIMEZONE: ${{ vars.APP_TIMEZONE }}
      BORSAPP_REPOSITORY_ROOT: ${{ github.workspace }}
      DELIVERY_MODE: ${{ vars.SCAN_DELIVERY_MODE || 'shadow' }}
      ENABLE_SHADOW_PARITY: ${{ vars.ENABLE_SHADOW_PARITY || 'false' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ALLOWED_USERS: ${{ vars.TELEGRAM_ALLOWED_USERS }}
      TELEGRAM_TOPIC_COMMAND: ${{ vars.TELEGRAM_TOPIC_COMMAND }}
      TELEGRAM_TOPIC_SCANS: ${{ vars.TELEGRAM_TOPIC_SCANS }}
      TELEGRAM_TOPIC_ANALYSIS: ${{ vars.TELEGRAM_TOPIC_ANALYSIS }}
      TELEGRAM_TOPIC_CHARTS: ${{ vars.TELEGRAM_TOPIC_CHARTS }}
      TELEGRAM_TOPIC_NEWS: ${{ vars.TELEGRAM_TOPIC_NEWS }}
      TELEGRAM_TOPIC_CALENDAR: ${{ vars.TELEGRAM_TOPIC_CALENDAR }}
      TELEGRAM_TOPIC_REPORTS: ${{ vars.TELEGRAM_TOPIC_REPORTS }}
      TELEGRAM_TOPIC_SYSTEM: ${{ vars.TELEGRAM_TOPIC_SYSTEM }}
      TELEGRAM_TIMEFRAME_TOPICS: ${{ vars.TELEGRAM_TIMEFRAME_TOPICS || secrets.TELEGRAM_TIMEFRAME_TOPICS }}
      TELEGRAM_TOPIC_15M: ${{ vars.TELEGRAM_TOPIC_15M || secrets.TELEGRAM_TOPIC_15M }}
      TELEGRAM_TOPIC_30M: ${{ vars.TELEGRAM_TOPIC_30M || secrets.TELEGRAM_TOPIC_30M }}
      TELEGRAM_TOPIC_45M: ${{ vars.TELEGRAM_TOPIC_45M || secrets.TELEGRAM_TOPIC_45M }}
      TELEGRAM_TOPIC_1H: ${{ vars.TELEGRAM_TOPIC_1H || secrets.TELEGRAM_TOPIC_1H }}
      TELEGRAM_TOPIC_60M: ${{ vars.TELEGRAM_TOPIC_60M || secrets.TELEGRAM_TOPIC_60M }}
      TELEGRAM_TOPIC_2H: ${{ vars.TELEGRAM_TOPIC_2H || secrets.TELEGRAM_TOPIC_2H }}
      TELEGRAM_TOPIC_4H: ${{ vars.TELEGRAM_TOPIC_4H || secrets.TELEGRAM_TOPIC_4H }}
      TELEGRAM_TOPIC_240M: ${{ vars.TELEGRAM_TOPIC_240M || secrets.TELEGRAM_TOPIC_240M }}
      TELEGRAM_TOPIC_1D: ${{ vars.TELEGRAM_TOPIC_1D || secrets.TELEGRAM_TOPIC_1D }}
      TELEGRAM_TOPIC_DAILY: ${{ vars.TELEGRAM_TOPIC_DAILY || secrets.TELEGRAM_TOPIC_DAILY }}
      TELEGRAM_TOPIC_1W: ${{ vars.TELEGRAM_TOPIC_1W || secrets.TELEGRAM_TOPIC_1W }}
      TELEGRAM_TOPIC_1WK: ${{ vars.TELEGRAM_TOPIC_1WK || secrets.TELEGRAM_TOPIC_1WK }}
      ATC_SCAN_UNIVERSE: ${{ vars.ATC_SCAN_UNIVERSE || 'ATC_630' }}
      MANUAL_SCOPE: ${{ inputs.scope }}
      MANUAL_SYMBOL: ${{ inputs.symbol }}
      MANUAL_TIMEFRAME: ${{ inputs.timeframe }}
      MANUAL_NOTIFY: ${{ inputs.notify }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime
        if: ${{ env.DATABASE_URL != '' }}
        run: python -m pip install ".[runtime,atcdata]"
      - name: Run requested scan
        if: ${{ env.DATABASE_URL != '' }}
        shell: bash
        run: |
          notify_flag=()
          if [ "$DELIVERY_MODE" = "live" ] && [ "$MANUAL_NOTIFY" = "true" ]; then
            notify_flag=(--notify)
          fi
          if [ "$MANUAL_SCOPE" = "symbol" ]; then
            borsapp scan-symbol "$MANUAL_SYMBOL" --timeframe "$MANUAL_TIMEFRAME" "${notify_flag[@]}"
          else
            borsapp scan-due --universe "$ATC_SCAN_UNIVERSE" --timeframe "$MANUAL_TIMEFRAME" "${notify_flag[@]}"
          fi
          if [ ${#notify_flag[@]} -gt 0 ]; then
            borsapp publisher-once --limit 100
          fi

  scheduled-scan:
    if: ${{ github.event_name == 'schedule' && vars.ENABLE_SCHEDULED_SCANS == 'true' }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        timeframe: [15m, 30m, 45m, 1h, 2h, 4h, 1d]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_ENV: production
      APP_TIMEZONE: ${{ vars.APP_TIMEZONE }}
      BORSAPP_REPOSITORY_ROOT: ${{ github.workspace }}
      DELIVERY_MODE: ${{ vars.SCAN_DELIVERY_MODE || 'shadow' }}
      ENABLE_SHADOW_PARITY: ${{ matrix.timeframe == '1d' && vars.ENABLE_SHADOW_PARITY || 'false' }}
      ATC_SCAN_UNIVERSE: ${{ vars.ATC_SCAN_UNIVERSE || 'ATC_630' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ALLOWED_USERS: ${{ vars.TELEGRAM_ALLOWED_USERS }}
      TELEGRAM_TOPIC_COMMAND: ${{ vars.TELEGRAM_TOPIC_COMMAND }}
      TELEGRAM_TOPIC_SCANS: ${{ vars.TELEGRAM_TOPIC_SCANS }}
      TELEGRAM_TOPIC_ANALYSIS: ${{ vars.TELEGRAM_TOPIC_ANALYSIS }}
      TELEGRAM_TOPIC_CHARTS: ${{ vars.TELEGRAM_TOPIC_CHARTS }}
      TELEGRAM_TOPIC_NEWS: ${{ vars.TELEGRAM_TOPIC_NEWS }}
      TELEGRAM_TOPIC_CALENDAR: ${{ vars.TELEGRAM_TOPIC_CALENDAR }}
      TELEGRAM_TOPIC_REPORTS: ${{ vars.TELEGRAM_TOPIC_REPORTS }}
      TELEGRAM_TOPIC_SYSTEM: ${{ vars.TELEGRAM_TOPIC_SYSTEM }}
      TELEGRAM_TIMEFRAME_TOPICS: ${{ vars.TELEGRAM_TIMEFRAME_TOPICS || secrets.TELEGRAM_TIMEFRAME_TOPICS }}
      TELEGRAM_TOPIC_15M: ${{ vars.TELEGRAM_TOPIC_15M || secrets.TELEGRAM_TOPIC_15M }}
      TELEGRAM_TOPIC_30M: ${{ vars.TELEGRAM_TOPIC_30M || secrets.TELEGRAM_TOPIC_30M }}
      TELEGRAM_TOPIC_45M: ${{ vars.TELEGRAM_TOPIC_45M || secrets.TELEGRAM_TOPIC_45M }}
      TELEGRAM_TOPIC_1H: ${{ vars.TELEGRAM_TOPIC_1H || secrets.TELEGRAM_TOPIC_1H }}
      TELEGRAM_TOPIC_60M: ${{ vars.TELEGRAM_TOPIC_60M || secrets.TELEGRAM_TOPIC_60M }}
      TELEGRAM_TOPIC_2H: ${{ vars.TELEGRAM_TOPIC_2H || secrets.TELEGRAM_TOPIC_2H }}
      TELEGRAM_TOPIC_4H: ${{ vars.TELEGRAM_TOPIC_4H || secrets.TELEGRAM_TOPIC_4H }}
      TELEGRAM_TOPIC_240M: ${{ vars.TELEGRAM_TOPIC_240M || secrets.TELEGRAM_TOPIC_240M }}
      TELEGRAM_TOPIC_1D: ${{ vars.TELEGRAM_TOPIC_1D || secrets.TELEGRAM_TOPIC_1D }}
      TELEGRAM_TOPIC_DAILY: ${{ vars.TELEGRAM_TOPIC_DAILY || secrets.TELEGRAM_TOPIC_DAILY }}
      TELEGRAM_TOPIC_1W: ${{ vars.TELEGRAM_TOPIC_1W || secrets.TELEGRAM_TOPIC_1W }}
      TELEGRAM_TOPIC_1WK: ${{ vars.TELEGRAM_TOPIC_1WK || secrets.TELEGRAM_TOPIC_1WK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime
        if: ${{ env.DATABASE_URL != '' }}
        run: python -m pip install ".[runtime,atcdata]"
      - name: Scan one isolated timeframe
        if: ${{ env.DATABASE_URL != '' }}
        shell: bash
        env:
          SCAN_TIMEFRAME: ${{ matrix.timeframe }}
        run: |
          notify_flag=()
          if [ "$DELIVERY_MODE" = "live" ]; then notify_flag=(--notify); fi
          borsapp scan-due --universe "$ATC_SCAN_UNIVERSE" --timeframe "$SCAN_TIMEFRAME" "${notify_flag[@]}"
      - name: Reuse existing timeframe topic and send PNG cards from confirmed scan
        if: ${{ env.DATABASE_URL != '' && vars.ENABLE_TIMEFRAME_IMAGE_REPORTS == 'true' }}
        env:
          SCAN_TIMEFRAME: ${{ matrix.timeframe }}
        run: python -m scripts.atc_timeframe_visuals --timeframe "$SCAN_TIMEFRAME"
      - name: Publish eligible findings
        if: ${{ env.DATABASE_URL != '' && always() }}
        run: borsapp publisher-once --limit 100
      - name: Report shadow parity
        if: ${{ env.DATABASE_URL != '' && env.ENABLE_SHADOW_PARITY == 'true' && matrix.timeframe == '1d' }}
        run: borsapp shadow-report --days 30
