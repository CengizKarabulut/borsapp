name: Telegram live pulse

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Listener çalışma süresi
        required: true
        default: "180"
        type: choice
        options: ["60", "180", "240"]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: borsapp-telegram-live-pulse
  cancel-in-progress: false

jobs:
  pulse:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_TELEGRAM_PULSE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_ENV: production
      APP_TIMEZONE: ${{ vars.APP_TIMEZONE }}
      DELIVERY_MODE: live
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ALLOWED_USERS: ${{ vars.TELEGRAM_ALLOWED_USERS }}
      TELEGRAM_ALLOW_CHAT_ADMINS: ${{ vars.TELEGRAM_ALLOW_CHAT_ADMINS || 'false' }}
      TELEGRAM_TOPIC_COMMAND: ${{ vars.TELEGRAM_TOPIC_COMMAND }}
      TELEGRAM_TOPIC_SCANS: ${{ vars.TELEGRAM_TOPIC_SCANS }}
      TELEGRAM_TOPIC_ANALYSIS: ${{ vars.TELEGRAM_TOPIC_ANALYSIS }}
      TELEGRAM_TOPIC_CHARTS: ${{ vars.TELEGRAM_TOPIC_CHARTS }}
      TELEGRAM_TOPIC_NEWS: ${{ vars.TELEGRAM_TOPIC_NEWS }}
      TELEGRAM_TOPIC_CALENDAR: ${{ vars.TELEGRAM_TOPIC_CALENDAR }}
      TELEGRAM_TOPIC_REPORTS: ${{ vars.TELEGRAM_TOPIC_REPORTS }}
      TELEGRAM_TOPIC_SYSTEM: ${{ vars.TELEGRAM_TOPIC_SYSTEM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime
        run: python -m pip install ".[runtime]"
      - name: Ensure database schema
        run: borsapp db-init
      - name: Poll commands, execute force jobs, and publish replies
        shell: bash
        env:
          MANUAL_DURATION: ${{ inputs.duration_seconds }}
        run: |
          duration="180"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            duration="$MANUAL_DURATION"
          fi
          deadline=$((SECONDS + duration))
          while [ "$SECONDS" -lt "$deadline" ]; do
            borsapp publisher-once --limit 50
            borsapp listener-once --timeout 20
            borsapp command-worker-once --timeframe 1h --bars 250
            borsapp publisher-once --limit 50
          done
