name: Telegram ASELS command smoke

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Test edilecek BIST sembolü
        required: true
        default: ASELS
        type: string
      backfill_days:
        description: Bildirim göndermeden doldurulacak KAP geçmişi; 0 devre dışı
        required: true
        default: "0"
        type: choice
        options: ["0", "30", "60", "90"]

permissions:
  contents: read

concurrency:
  group: borsapp-telegram-command-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: production
      APP_TIMEZONE: ${{ vars.APP_TIMEZONE }}
      BORSAPP_REPOSITORY_ROOT: ${{ github.workspace }}
      DELIVERY_MODE: live
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ALLOWED_USERS: ${{ vars.TELEGRAM_ALLOWED_USERS }}
      TELEGRAM_TOPIC_COMMAND: ${{ vars.TELEGRAM_TOPIC_COMMAND }}
      TELEGRAM_TOPIC_SCANS: ${{ vars.TELEGRAM_TOPIC_SCANS }}
      TELEGRAM_TOPIC_ANALYSIS: ${{ vars.TELEGRAM_TOPIC_ANALYSIS }}
      TELEGRAM_TOPIC_CHARTS: ${{ vars.TELEGRAM_TOPIC_CHARTS }}
      TELEGRAM_TOPIC_NEWS: ${{ vars.TELEGRAM_TOPIC_NEWS }}
      TELEGRAM_TOPIC_CALENDAR: ${{ vars.TELEGRAM_TOPIC_CALENDAR }}
      TELEGRAM_TOPIC_REPORTS: ${{ vars.TELEGRAM_TOPIC_REPORTS }}
      TELEGRAM_TOPIC_SYSTEM: ${{ vars.TELEGRAM_TOPIC_SYSTEM }}
      SMOKE_SYMBOL: ${{ inputs.symbol }}
      KAP_BACKFILL_DAYS: ${{ inputs.backfill_days }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime
        run: python -m pip install ".[runtime]"
      - name: Ensure database schema
        run: borsapp db-init
      - name: Backfill KAP history without notifications
        if: ${{ inputs.backfill_days != '0' }}
        run: borsapp news-kap-backfill --days "$KAP_BACKFILL_DAYS" --chunk-days 3
      - name: Queue every supported command response
        run: borsapp telegram-smoke-symbol "$SMOKE_SYMBOL" --confirm-live
      - name: Publish stored command responses and job acknowledgements
        continue-on-error: true
        run: borsapp publisher-once --limit 30
      - name: Execute queued analysis, report, fundamental, chart and force jobs
        shell: bash
        run: |
          failed=0
          for _ in {1..12}; do
            borsapp command-worker-once --timeframe 1h --bars 320 || failed=1
            borsapp publisher-once --limit 100 || failed=1
          done
          exit "$failed"
      - name: Publish remaining completions
        if: always()
        run: borsapp publisher-once --limit 100
      - name: Show safe command job diagnostics
        if: always()
        run: borsapp command-jobs-status --limit 20
