name: Grafik Telegram Botu

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

concurrency:
  group: chart-telegram-bot
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: apps/chart_bot
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/chart_bot/requirements.txt
      - name: Bağımlılıklar
        run: python -m pip install --requirement requirements.txt
      - name: Bot durumunu geri yükle
        uses: actions/cache/restore@v4
        with:
          path: apps/chart_bot/state
          key: chart-bot-offset-${{ github.run_id }}
          restore-keys: chart-bot-offset-
      - name: Dinle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CHART_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.CHART_TOPIC_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_WORKFLOW_FILE: chart-bot.yml
          BOT_RUN_MINUTES: "50"
        run: python -m src.bot_runner
      - name: Bot durumunu sakla
        if: always()
        uses: actions/cache/save@v4
        with:
          path: apps/chart_bot/state
          key: chart-bot-offset-${{ github.run_id }}
