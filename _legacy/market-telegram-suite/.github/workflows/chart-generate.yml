name: Grafik Üret

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Sembol (THYAO, AAPL, BTC-USD, bist:ASELS)"
        required: true
        default: "THYAO"
      interval:
        description: "Bar aralığı (ör. 4h,1d,1wk)"
        required: true
        default: "4h,1d,1wk,1mo"
      views:
        description: "Kareler"
        required: false
        default: "set"
      theme:
        description: "Tema"
        required: false
        default: "tv"
        type: choice
        options: [tv, ink, paper]
      send_telegram:
        description: "Grafik botunun konusuna gönder"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/chart_bot
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/chart_bot/requirements.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Grafiği üret
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CHART_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.CHART_TOPIC_ID }}
        run: |
          SEND_FLAG=""
          if [ "${{ inputs.send_telegram }}" = "true" ]; then SEND_FLAG="--telegram"; fi
          python -m src.cli \
            --symbol "${{ inputs.symbol }}" \
            --interval "${{ inputs.interval }}" \
            --views "${{ inputs.views }}" \
            --theme "${{ inputs.theme }}" \
            --grid 0 \
            --outdir out \
            $SEND_FLAG
      - name: Çıktıları sakla
        uses: actions/upload-artifact@v7
        with:
          name: grafik-${{ inputs.symbol }}-${{ inputs.interval }}
          path: apps/chart_bot/out/
          retention-days: 14
