name: Teknik Analiz Telegram Botu

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6-18 * * 1-5"

permissions:
  contents: read
  actions: write

concurrency:
  group: technical-telegram-bot
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/technical_bot
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/technical_bot/requirements.txt
      - name: Bağımlılıkları yükle
        run: python -m pip install --requirement requirements.txt
      - name: Durum dosyalarını geri yükle
        uses: actions/cache@v4
        with:
          path: |
            apps/technical_bot/reports/telegram_offset.json
            apps/technical_bot/reports/scan_schedule.json
            apps/technical_bot/reports/bot_settings.json
            apps/technical_bot/reports/watchlist.json
            apps/technical_bot/reports/screener.json
            apps/technical_bot/reports/bist_universe.json
          key: technical-bot-${{ github.run_id }}
          restore-keys: technical-bot-
      - name: Komutları işle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TECHNICAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TECHNICAL_TOPIC_ID }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_WORKFLOW_FILE: technical-bot.yml
          SCAN_WORKFLOW_FILE: technical-scan.yml
          BOT_RUN_MINUTES: "50"
          BOT_LONG_POLL_SECONDS: "25"
          BOT_SELF_RESTART: "1"
          BOT_DRIVES_SCAN: "1"
        run: python -m src.bot_runner_fundamental
      - name: Durum dosyalarını sakla
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            apps/technical_bot/reports/telegram_offset.json
            apps/technical_bot/reports/scan_schedule.json
            apps/technical_bot/reports/bot_settings.json
            apps/technical_bot/reports/watchlist.json
            apps/technical_bot/reports/screener.json
            apps/technical_bot/reports/bist_universe.json
          key: technical-bot-${{ github.run_id }}
      - name: Komut çıktılarını sakla
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: teknik-bot-ciktilari-${{ github.run_id }}
          path: apps/technical_bot/reports/komut/**/*.png
          if-no-files-found: ignore
          retention-days: 7
