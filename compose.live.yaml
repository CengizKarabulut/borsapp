services:
  scanner:
    environment:
      DELIVERY_MODE: live
    command:
      - scan-worker
      - --timeframes
      - 15m,30m,45m,1h,2h,4h,1d
      - --universe
      - BIST_ALL
      - --notify
  listener:
    environment:
      DELIVERY_MODE: live
  publisher:
    environment:
      DELIVERY_MODE: live
  command-worker:
    environment:
      DELIVERY_MODE: live
