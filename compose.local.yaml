# Laptop profile: reserve CPU time for Windows and keep numerical libraries single-threaded.
x-laptop-environment: &laptop-environment
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

services:
  universe-worker:
    cpus: "0.25"
    cpu_shares: 128
    profiles: ["runtime"]
    build: .
    image: borsapp:local
    env_file: .env
    environment:
      <<: *laptop-environment
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://borsapp:borsapp@postgres:5432/borsapp}
      DELIVERY_MODE: disabled
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          borsapp universe-sync --universe BIST_ALL --apply || true
          sleep 21600
        done
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  news-worker:
    cpus: "0.50"
    cpu_shares: 512
    profiles: ["runtime"]
    build: .
    image: borsapp:local
    env_file: .env
    environment:
      <<: *laptop-environment
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://borsapp:borsapp@postgres:5432/borsapp}
      DELIVERY_MODE: live
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          borsapp news-kap-sync --lookback-days 1 --notify || true
          borsapp news-general-sync --lookback-days 1 --notify || true
          sleep 600
        done
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  research-worker:
    cpus: "0.50"
    cpu_shares: 128
    profiles: ["runtime"]
    build: .
    image: borsapp:local
    env_file: .env
    environment:
      <<: *laptop-environment
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://borsapp:borsapp@postgres:5432/borsapp}
      DELIVERY_MODE: disabled
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 900
        while true; do
          borsapp ma-research-universe --universe BIST_ALL --timeframe 1h --bars 1000 || true
          borsapp ma-research-universe --universe BIST_ALL --timeframe 4h --bars 1000 || true
          borsapp ma-research-universe --universe BIST_ALL --timeframe 1d --bars 1000 || true
          borsapp ma-research-universe --universe BIST_ALL --timeframe 1wk --bars 420 || true
          sleep 86400
        done
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  outcomes-worker:
    cpus: "0.25"
    cpu_shares: 128
    profiles: ["runtime"]
    build: .
    image: borsapp:local
    env_file: .env
    environment:
      <<: *laptop-environment
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://borsapp:borsapp@postgres:5432/borsapp}
      DELIVERY_MODE: disabled
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 1800
        while true; do
          borsapp outcomes-backfill --days 90 --horizon 5,10,20 || true
          sleep 86400
        done
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  backup-worker:
    cpus: "0.25"
    cpu_shares: 128
    profiles: ["runtime"]
    image: postgres:16-alpine
    env_file: .env
    environment:
      <<: *laptop-environment
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          backup="/backups/borsapp-$$(date -u +%Y%m%d-%H%M%S).dump"
          if pg_dump -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" \
              -Fc -f /backups/.borsapp-backup.pending \
              && pg_restore --list /backups/.borsapp-backup.pending >/dev/null \
              && mv /backups/.borsapp-backup.pending "$${backup}"; then
            find /backups -type f \( -name 'borsapp-*.sql.gz' -o -name 'borsapp-*.dump' \) -mtime +14 -delete
            sleep 86400
          else
            echo "PostgreSQL backup failed; retry in 5 minutes" >&2
            sleep 300
          fi
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  scan-report-worker:
    cpus: "0.75"
    cpu_shares: 256
    profiles: ["runtime"]
    build: .
    image: borsapp:local
    env_file: .env
    environment:
      <<: *laptop-environment
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://borsapp:borsapp@postgres:5432/borsapp}
      DELIVERY_MODE: live
    command: ["command-worker-loop", "--scan-reports-only"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  financial-worker:
    cpus: "0.50"
    cpu_shares: 128
    environment:
      <<: *laptop-environment

  scanner:
    cpus: "1.50"
    cpu_shares: 1024
    environment:
      <<: *laptop-environment

  command-worker:
    cpus: "1.00"
    cpu_shares: 768
    environment:
      <<: *laptop-environment

  listener:
    cpus: "0.50"
    cpu_shares: 1024
    environment:
      <<: *laptop-environment

  publisher:
    cpus: "0.50"
    cpu_shares: 1024
    environment:
      <<: *laptop-environment
