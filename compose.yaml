services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-borsapp}
      POSTGRES_USER: ${POSTGRES_USER:-borsapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-borsapp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - borsapp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  scanner:
    profiles: ["runtime"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://borsapp:borsapp@postgres:5432/borsapp}
    command:
      - scan-worker
      - --timeframes
      - 15m,30m,45m,1h,2h,4h,1d
      - --universe
      - BIST_ALL
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  listener:
    profiles: ["runtime"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://borsapp:borsapp@postgres:5432/borsapp}
    command: ["listener-loop"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  publisher:
    profiles: ["runtime"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://borsapp:borsapp@postgres:5432/borsapp}
    command: ["publisher-loop"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  borsapp-postgres:
