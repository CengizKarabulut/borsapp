services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-borsapp}
      POSTGRES_USER: ${POSTGRES_USER:-borsapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-borsapp}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - borsapp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 180s

  migrate:
    profiles: ["runtime"]
    build: .
    image: borsapp:local
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://borsapp:borsapp@postgres:5432/borsapp}
    command: ["db-migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  scanner:
    profiles: ["runtime"]
    build: .
    image: borsapp:local
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://borsapp:borsapp@postgres:5432/borsapp}
    command:
      - scan-worker
      - --timeframes
      - 15m,30m,45m,1h,2h,4h,1d
      - --universe
      - BIST_ALL
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "borsapp", "doctor"]
      interval: 30s
      timeout: 15s
      retries: 3

  listener:
    profiles: ["runtime"]
    build: .
    image: borsapp:local
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://borsapp:borsapp@postgres:5432/borsapp}
    command: ["listener-loop"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "borsapp", "doctor"]
      interval: 30s
      timeout: 15s
      retries: 3

  publisher:
    profiles: ["runtime"]
    build: .
    image: borsapp:local
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://borsapp:borsapp@postgres:5432/borsapp}
      BORSAPP_ARTIFACT_ROOT: /app/runtime_artifacts
    volumes:
      - borsapp-artifacts:/app/runtime_artifacts
    command: ["publisher-loop"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "borsapp", "doctor"]
      interval: 30s
      timeout: 15s
      retries: 3

  command-worker:
    profiles: ["runtime"]
    build: .
    image: borsapp:local
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://borsapp:borsapp@postgres:5432/borsapp}
      BORSAPP_ARTIFACT_ROOT: /app/runtime_artifacts
      BORSAPP_FINANCIAL_ARCHIVE: /app/financial_archive
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - borsapp-artifacts:/app/runtime_artifacts
      - borsapp-financials:/app/financial_archive
    command: ["command-worker-loop", "--timeframe", "1h"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "borsapp", "doctor"]
      interval: 30s
      timeout: 15s
      retries: 3

  financial-worker:
    profiles: ["financials"]
    build: .
    image: borsapp:local
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://borsapp:borsapp@postgres:5432/borsapp}
      BORSAPP_FINANCIAL_ARCHIVE: /app/financial_archive
      DELIVERY_MODE: disabled
    volumes:
      - borsapp-financials:/app/financial_archive
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if borsapp financial-sync --universe BIST_ALL --lookback-days 7 --bootstrap-days 2190; then
            sleep 86400
          else
            sleep 900
          fi
        done
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  borsapp-postgres:
  borsapp-artifacts:
  borsapp-financials:
