services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-borsapp}
      POSTGRES_USER: ${POSTGRES_USER:-borsapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-borsapp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - borsapp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  borsapp-postgres:
