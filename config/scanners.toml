[technical.volume_spike]
enabled = true
version = "1.0.0"
relative_volume_threshold = 3.0
minimum_average_turnover = 20000000.0
minimum_price = 1.0
baseline_window = 20
minimum_history = 5
partial_bar_policy = "drop"

# İlk pilotta bildirim trafiği sınırlıdır. Diğer canonical zaman dilimleri
# shadow çalışabilir ama Telegram'a yazmaz.
shadow_timeframes = ["15m", "30m", "45m", "1h", "2h", "4h", "1d"]
notification_timeframes = ["1h", "4h", "1d"]

[ma.near_zone]
enabled = true
version = "1.0.0"
maximum_distance_atr = 1.0
accepted_level_classes = ["strong_level", "level"]
maximum_levels_per_side = 2
partial_bar_policy = "drop"
shadow_timeframes = ["1h", "4h", "1d", "1wk", "1mo"]
notification_timeframes = ["4h", "1d"]

[signal.macd_positive_cross]
enabled = true
version = "1.0.0"
minimum_rsi = 30.0
require_positive_macd = true
trigger_mode = "legacy_rising_or_cross"
partial_bar_policy = "drop"
shadow_timeframes = ["15m", "30m", "45m", "1h", "2h", "4h", "1d"]
notification_timeframes = ["1h", "4h", "1d"]

[signal.smi_macd_positive]
enabled = true
version = "1.0.0"
minimum_history = 200
partial_bar_policy = "drop"
shadow_timeframes = ["15m", "30m", "45m", "1h", "2h", "4h", "1d"]
notification_timeframes = ["1h", "4h", "1d"]

[signal.smi_macd_positive_volume_confirmed]
enabled = true
version = "1.0.0"
minimum_history = 200
volume_multiplier = 1.5
partial_bar_policy = "drop"
shadow_timeframes = ["15m", "30m", "45m", "1h", "2h", "4h", "1d"]
notification_timeframes = ["1h", "4h", "1d"]
