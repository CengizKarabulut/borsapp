[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "borsapp-market-intelligence"
version = "0.1.0"
description = "Unified market data, scanning, research, news, and Telegram platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary until source repository licenses are reconciled" }
authors = [{ name = "Cengiz Karabulut" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.5,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["market_intelligence*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
