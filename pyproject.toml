[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "borsapp-market-intelligence"
version = "0.1.0"
description = "Unified market data, scanning, research, news, and Telegram platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary until source repository licenses are reconciled" }
authors = [{ name = "Cengiz Karabulut" }]
dependencies = []

[project.scripts]
borsapp = "market_intelligence.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.5,<1"]
runtime = [
    "borsapy>=0.10,<1",
    "exchange-calendars>=4.13,<5",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "pandas>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "yfinance>=0.2,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["market_intelligence*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
